name: Group Rate Matrix Check
on:
  pull_request:
    branches: [feature/hotel-cards-preview]
jobs:
  pricing-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-group-rate-matrix.cjs
      - run: npm run build
