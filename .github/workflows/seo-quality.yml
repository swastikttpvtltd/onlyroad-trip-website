name: SEO and production preview checks
on:
  pull_request:
    branches: [feature/hotel-cards-preview, main]
  push:
    branches: [preview/door-to-door-seo-20261011]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate optimized hero assets
        run: node scripts/generate-hero-images.mjs
      - name: SEO, metadata and structured-data checks
        run: node scripts/check-seo.cjs
      - name: Existing pricing checks
        run: node scripts/check-group-rate-matrix.cjs
      - name: Public AI tools and IndexNow privacy checks
        run: node scripts/check-travel-tools.mjs
      - name: Scope, performance payload and enquiry validation
        run: node scripts/check-search-completion.cjs
      - name: TypeScript check
        run: npx tsc --noEmit --incremental false
      - name: Production Next.js build
        run: npm run build
      - name: Cloudflare adapter build
        run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Mobile Lighthouse preview measurements
        run: node scripts/lighthouse-preview.mjs
        timeout-minutes: 12
      - name: Save public preview measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-preview
          path: lighthouse-results/
          if-no-files-found: ignore
